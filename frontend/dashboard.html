<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Streetline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="report.html">
      <span class="brand__mark" data-icon="pin" data-icon-class="icon"></span>
      <span class="brand__name">Streetline</span>
    </a>
    <nav class="site-nav">
      <a href="report.html">
        <span data-icon="camera" data-icon-class="icon icon--sm"></span>
        <span class="nav-text">Report</span>
      </a>
      <a href="dashboard.html" aria-current="page">
        <span data-icon="chart" data-icon-class="icon icon--sm"></span>
        <span class="nav-text">Dashboard</span>
      </a>
    </nav>
  </div>
</header>

<main class="page">

  <div class="hero">
    <h1>Every report, one line at a time.</h1>
    <p>Track each issue from first report to fixed. Click a stop on any report's line to move it forward.</p>
  </div>

  <div class="stats" id="stats-row"></div>

  <div class="stage-overview">
    <p class="stage-overview__title">Reports by stage, right now</p>
    <div class="stage-overview__rail" id="stage-overview-rail"></div>
  </div>

  <div class="map-frame"><div id="map"></div></div>

  <div id="reports-list"></div>
  <div id="empty-state" class="empty-state hidden">
    <span data-icon="pin" data-icon-class="icon icon--xl"></span>
    <p>No reports yet. <a href="report.html">Report the first one.</a></p>
  </div>

</main>

<footer class="site-footer">Dashboard refreshes automatically every 15 seconds.</footer>

<script src="icons.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_BASE = window.location.origin;

const STAGES = [
  { key: 'Reported',     label: 'Reported',     icon: 'flag' },
  { key: 'Acknowledged',  label: 'Acknowledged',  icon: 'clipboard' },
  { key: 'In Progress',   label: 'In progress',   icon: 'wrench' },
  { key: 'Resolved',      label: 'Resolved',      icon: 'check' },
];

const CATEGORY_META = {
  pothole:            { label: 'Pothole',            icon: 'pothole' },
  garbage:             { label: 'Garbage',             icon: 'garbage' },
  broken_streetlight:  { label: 'Broken streetlight',  icon: 'streetlight' },
  water_leakage:       { label: 'Water leakage',       icon: 'water' },
};

const map = L.map('map').setView([26.8467, 80.9462], 12); // default: Lucknow
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19,
}).addTo(map);
let markers = [];

function stageIndex(status) {
  const i = STAGES.findIndex(s => s.key === status);
  return i === -1 ? 0 : i;
}

// Builds a route rail. `current` = stage index. `onPick`, if given, makes
// each stop a clickable button (used on report tickets to change status).
function renderRail({ current, size = '', onPick }) {
  const fillPct = (current / (STAGES.length - 1)) * 75; // track spans 12.5%-87.5%
  const stops = STAGES.map((stage, i) => {
    let state = '';
    if (i < current) state = 'rail__stop--done';
    else if (i === current) state = 'rail__stop--current';
    const clickable = onPick ? 'rail__stop--clickable' : '';
    const tag = onPick ? 'button' : 'div';
    const typeAttr = onPick ? 'type="button"' : '';
    return `<${tag} ${typeAttr} class="rail__stop ${state} ${clickable}" data-stage-index="${i}" ${onPick ? '' : 'disabled'}>
      <span class="rail__dot">${icon(stage.icon)}</span>
      <span class="rail__label">${stage.label}</span>
    </${tag}>`;
  }).join('');

  return `<div class="rail ${size}">
    <div class="rail__track"></div>
    <div class="rail__track-fill" style="width:${fillPct}%"></div>
    ${stops}
  </div>`;
}

async function loadStats() {
  const res = await fetch(`${API_BASE}/stats`);
  const data = await res.json();
  const row = document.getElementById('stats-row');
  const resolvedPct = data.total ? Math.round((data.resolved / data.total) * 100) : 0;
  row.innerHTML = `
    <div class="stat stat--blue"><div class="stat__num">${data.total}</div><div class="stat__label">Total reports</div></div>
    <div class="stat stat--green"><div class="stat__num">${resolvedPct}%</div><div class="stat__label">Resolution rate</div></div>
    <div class="stat stat--amber"><div class="stat__num">${data.by_status['In Progress'] || 0}</div><div class="stat__label">In progress</div></div>
    <div class="stat stat--red"><div class="stat__num">${data.by_status['Reported'] || 0}</div><div class="stat__label">Awaiting action</div></div>
  `;

  const overviewEl = document.getElementById('stage-overview-rail');
  overviewEl.innerHTML = STAGES.map(stage => `
    <div class="stage-overview__stop">
      <div class="rail__dot" style="margin:0 auto 8px">${icon(stage.icon, 'icon icon--sm')}</div>
      <div class="stage-overview__count">${data.by_status[stage.key] || 0}</div>
      <div class="rail__label">${stage.label}</div>
    </div>
  `).join('');
}

async function updateStatus(reportId, status) {
  const form = new FormData();
  form.append('status', status);
  await fetch(`${API_BASE}/reports/${reportId}/status`, { method: 'POST', body: form });
  await refresh();
}

async function loadReports() {
  const res = await fetch(`${API_BASE}/reports`);
  const reports = await res.json();
  const list = document.getElementById('reports-list');
  const emptyState = document.getElementById('empty-state');
  list.innerHTML = '';
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  if (reports.length === 0) {
    emptyState.classList.remove('hidden');
    return;
  }
  emptyState.classList.add('hidden');

  reports.forEach(r => {
    const meta = CATEGORY_META[r.category] || { label: r.category, icon: 'warning' };
    const current = stageIndex(r.status);

    const card = document.createElement('div');
    card.className = 'ticket report-ticket';
    card.innerHTML = `
      <img class="report-ticket__photo" src="${API_BASE}${r.image_path}" alt="">
      <div>
        <div class="report-ticket__head">
          <div class="report-ticket__title">
            ${icon(meta.icon, 'icon icon--lg')}
            <div>
              <div class="report-ticket__category">${meta.label}</div>
              <div class="report-ticket__id">#${r.id} &middot; ${Math.round(r.confidence * 100)}% confidence${r.needs_review ? ' &middot; needs review' : ''}</div>
            </div>
          </div>
        </div>
        <div class="report-ticket__address">${icon('pin', 'icon icon--sm')}<span>${r.address}</span></div>
        <div class="rail-container"></div>
      </div>
    `;
    card.querySelector('.rail-container').innerHTML = renderRail({ current, onPick: true });
    card.querySelectorAll('.rail__stop--clickable').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.stageIndex);
        updateStatus(r.id, STAGES[idx].key);
      });
    });
    list.appendChild(card);

    const marker = L.marker([r.latitude, r.longitude]).addTo(map);
    marker.bindPopup(`<b>${meta.label}</b><br>${r.status}<br>${r.address}`);
    markers.push(marker);
  });

  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.3));
}

async function refresh() {
  await Promise.all([loadStats(), loadReports()]);
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
